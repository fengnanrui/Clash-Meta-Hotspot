name: Release Hotspot APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # Native version metadata resolves the remote branch containing the pinned mihomo commit.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check tag and test hotspot rules
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "versionName = \"${RELEASE_TAG#v}\"" build.gradle.kts
          python3 -m unittest discover -s tests -v
      - name: Prepare Android SDK and patched Go
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          mkdir -p "$RUNNER_TEMP/cmfa-go"
          curl -fsSL --retry 3 https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz -o "$RUNNER_TEMP/cmfa-go.tar.gz"
          echo "f2f3aab2fc72a4d4dd0123e088ed6611526b50b4e82d4c234ec24772ffb16981  $RUNNER_TEMP/cmfa-go.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/cmfa-go.tar.gz" -C "$RUNNER_TEMP/cmfa-go"
          for change in .github/patch/*.patch; do
            patch -d "$RUNNER_TEMP/cmfa-go/go" -p1 < "$change"
          done
          echo "$RUNNER_TEMP/cmfa-go/go/bin" >> "$GITHUB_PATH"
          cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt
          printf 'sdk.dir=%s\ncustom.application.id=com.github.metacubex.clash.hotspot\nremove.suffix=true\n' "$ANDROID_HOME" > local.properties
      - name: Build signed release
        env:
          KEYSTORE_B64: ${{ secrets.HOTSPOT_KEYSTORE_B64 }}
          SIGNING_B64: ${{ secrets.HOTSPOT_SIGNING_PROPERTIES_B64 }}
          GOTOOLCHAIN: local
        run: |
          umask 077
          test -n "$KEYSTORE_B64" && test -n "$SIGNING_B64"
          trap 'rm -f hotspot-ci.keystore signing.properties' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > hotspot-ci.keystore
          printf '%s' "$SIGNING_B64" | base64 -d > signing.properties
          unset KEYSTORE_B64 SIGNING_B64
          gradle --no-daemon :app:assembleMetaRelease -PtargetAbis=arm64-v8a --max-workers=2
      - name: Verify APK and assemble source archive
        run: |
          version=${RELEASE_TAG#v}
          prefix=Clash-Meta-Hotspot-$version
          mkdir dist
          apk="dist/$prefix-arm64-v8a.apk"
          cp "app/build/outputs/apk/meta/release/cmfa-$version-meta-arm64-v8a-release.apk" "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signer.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: 26b9136d5613920e7047b2978d94f5399acbc34e6288a7c95758b78ebc58cbdd' "$RUNNER_TEMP/signer.txt"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep "^package: name='com.github.metacubex.clash.hotspot' .*versionName='$version'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
          git archive --prefix="$prefix/" -o "$RUNNER_TEMP/source.tar" HEAD
          core=core/src/foss/golang/clash
          git -C "$core" archive --prefix="$prefix/$core/" -o "$RUNNER_TEMP/core.tar" HEAD
          tar --concatenate -f "$RUNNER_TEMP/source.tar" "$RUNNER_TEMP/core.tar"
          gzip -c "$RUNNER_TEMP/source.tar" > "dist/$prefix-source.tar.gz"
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Clash-Meta-Hotspot ${RELEASE_TAG#v}" --generate-notes
